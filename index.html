<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Panorama Maps · explore connected panoramas</title>
<meta name="description" content="Panorama Maps: explore connected 360-degree locations on a real 2D map. Create maps, place panorama nodes, connect them, and walk through continuous environments.">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>

<!-- ============ stage (canvas is the priority) ============ -->
<div id="stage">
  <canvas id="panoCanvas" aria-label="Panorama viewer. Drag to look around, use W A S D to move."></canvas>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div id="panoLoading" class="show"><div><div class="spinner"></div>Preparing panorama…</div></div>
</div>

<!-- ============ top toolbar — ONE surface, grouped controls ============ -->
<header id="topbar">
  <div class="tb-group" id="brandGroup">
    <button class="tb-btn" id="backBtn" title="Back to start screen" aria-label="Back to start screen"><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="tb-btn brand" id="homeBtn" title="Demos and create" aria-label="Demos and create"><span class="logo"><svg><use href="#i-logo"/></svg></span><span class="tb-txt" id="brandTxt">Panorama Maps</span></button>
    <button class="tb-btn" id="worldBtn" title="Choose world" aria-label="Choose world" aria-haspopup="true"><svg class="ic"><use href="#i-globe"/></svg><span class="tb-txt" id="worldName">World</span><svg class="ic chev"><use href="#i-chev"/></svg></button>
  </div>

  <div class="tb-group tb-grow" id="searchGroup">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="searchInput" type="search" placeholder="Search locations or landmarks" aria-label="Search locations or landmarks" autocomplete="off">
    <div class="pop" id="searchResults" role="listbox"></div>
  </div>

  <div class="tb-group" id="modeGroup" hidden>
    <button class="tb-btn mode-btn" data-mode="day" title="Daylight scenes"><svg class="ic"><use href="#i-sun"/></svg><span class="tb-txt">Day</span></button>
    <button class="tb-btn mode-btn" data-mode="rain" title="Rain scenes"><svg class="ic"><use href="#i-rain"/></svg><span class="tb-txt">Rain</span></button>
    <button class="tb-btn mode-btn" data-mode="night" title="Night scenes"><svg class="ic"><use href="#i-moon"/></svg><span class="tb-txt">Night</span></button>
  </div>

  <div class="tb-group">
    <button class="tb-btn" id="studioBtn" title="Studio: Simple · tap to switch" aria-label="Switch studio"><svg class="ic"><use href="#i-edit"/></svg><span class="tb-txt" id="studioTxt">Simple</span></button>
    <button class="tb-btn" id="menuBtn" title="Panels and options" aria-label="Panels and options" aria-haspopup="true"><svg class="ic"><use href="#i-panels"/></svg></button>
    <button class="tb-btn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen"><svg class="ic"><use href="#i-max"/></svg></button>
  </div>
</header>

<div class="pop menu" id="mainMenu" role="menu" aria-label="More options"></div>
<div class="pop menu" id="worldMenu" role="menu" aria-label="Worlds"></div>

<!-- ============ floating widgets ============ -->
<button id="compass" class="widget" title="Reset north" aria-label="Compass, tap to face north">
  <span class="n">N</span>
  <svg class="needle" viewBox="0 0 24 24" id="compassNeedle"><path d="M12 3l4 9-4 9-4-9z" fill="#d93025"/><path d="M12 3l4 9h-4z" fill="#f4b3ac"/></svg>
</button>

<section class="widget" id="locCard" aria-label="Current location">
  <div class="lc-head">
    <div class="lc-t">
      <h2 id="locName">—</h2>
      <div class="zone" id="locZone">—</div>
    </div>
    <button class="mini" id="lcHide" title="Hide card" aria-label="Hide location card"><svg><use href="#i-close"/></svg></button>
  </div>
  <dl id="lcDetails">
    <dt>Position</dt><dd id="locPos">—</dd>
    <dt>Walked</dt><dd id="locDist">0 m</dd>
    <dt>Zone</dt><dd id="locBound">—</dd>
    <dt>Links</dt><dd id="locLinks">—</dd>
  </dl>
</section>

<div class="widget" id="movePad" role="group" aria-label="Movement controls">
  <button class="mbtn" data-dir="forward" title="Move forward (W)" aria-label="Move forward"><svg><use href="#i-up"/></svg></button>
  <div class="mp-row">
    <button class="mbtn" data-dir="left" title="Move left (A)" aria-label="Move left"><svg><use href="#i-left"/></svg></button>
    <button class="mbtn" data-dir="backward" title="Move backward (S)" aria-label="Move backward"><svg><use href="#i-down"/></svg></button>
    <button class="mbtn" data-dir="right" title="Move right (D)" aria-label="Move right"><svg><use href="#i-right"/></svg></button>
  </div>
</div>

<section class="widget" id="mapWidget" aria-label="2D map">
  <div class="mw-head">
    <span class="t" id="mapTitle">Map</span>
    <button class="mini" id="mapZoomIn" title="Zoom in" aria-label="Zoom map in"><svg><use href="#i-zoomin"/></svg></button>
    <button class="mini" id="mapZoomOut" title="Zoom out" aria-label="Zoom map out"><svg><use href="#i-zoomout"/></svg></button>
    <button class="mini" id="mapFit" title="Fit world" aria-label="Fit world to map"><svg><use href="#i-fit"/></svg></button>
    <button class="mini" id="mapExpand" title="Expand map" aria-label="Expand map"><svg><use href="#i-max"/></svg></button>
    <button class="mini" id="mapHide" title="Hide map" aria-label="Hide map"><svg><use href="#i-close"/></svg></button>
  </div>
  <div id="mapCanvasWrap"><canvas id="mapCanvas" aria-label="2D map"></canvas></div>
</section>

<button id="mapFab" title="Show map" aria-label="Show map"><svg><use href="#i-map"/></svg></button>
<div id="debugOverlay" hidden aria-label="Developer overlay"></div>
<div id="toasts" aria-live="polite"></div>

<!-- ============ panels (editors render into these) ============ -->
<aside class="panel" id="editorPanel" hidden></aside>
<aside class="panel" id="advPanel" hidden></aside>

<!-- ============ landing / start screen ============ -->
<div id="landing" aria-modal="true" role="dialog" aria-label="Welcome to Panorama Maps"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Panorama Maps — explore connected panoramas</title>
<meta name="description" content="Panorama Maps: explore connected 360-degree locations on a real 2D map. Create maps, place panorama nodes, connect them, and walk through continuous environments.">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Ccircle cx='16' cy='14' r='7' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='14' r='2.4' fill='white'/%3E%3Cpath d='M9 25l5-6 4 4 3-3 2 5z' fill='white' opacity='.85'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============ SVG icon sprite (Lucide-style, inline: offline-safe) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="7"/><path d="M5 21l4.5-5.5M19 21l-4.5-5.5"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20M2 12h20"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.88 1.88M14.12 3.88 16 2M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6ZM12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.5 17c0 2.1-1.6 3.9-3.5 4"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m7-7-7 7-7-7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-zoomin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></symbol>
    <symbol id="i-zoomout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
    <symbol id="i-magic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.1 5.6a2 2 0 0 0-4.2 0L3 8.4V19a2 2 0 0 0 1.1 1.8l6 2a2 2 0 0 0 3.8 0l6-2A2 2 0 0 0 21 19V5a2 2 0 0 0-1.1-1.8Z"/><path d="M15 5.8v14M9 4.2v14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2m10.6 11.4A2 2 0 1 0 14 16H2"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2M16 14v6M8 14v6M12 16v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  </defs>
</svg>

<!-- ============ stage ============ -->
<div id="stage">
  <canvas id="panoCanvas" aria-label="Panorama viewer. Drag to look around, use W A S D to move."></canvas>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div id="panoLoading" class="show"><div><div class="spinner"></div>Preparing panorama…</div></div>
</div>

<!-- ============ chrome ============ -->
<div class="chrome" id="brandBar">
  <div class="card" id="brand"><span class="logo"><svg><use href="#i-logo"/></svg></span><span class="txt">Panorama Maps</span></div>
  <button class="card" id="worldBtn" aria-label="Choose world" title="Choose world"><svg><use href="#i-globe"/></svg><span id="worldName">World</span><svg><use href="#i-chev"/></svg></button>
</div>

<div class="chrome card" id="worldMenu" role="menu" aria-label="Worlds"></div>

<div class="chrome" id="searchBar">
  <div class="card" id="searchBox">
    <svg><use href="#i-search"/></svg>
    <input id="searchInput" type="search" placeholder="Search locations or landmarks" aria-label="Search locations or landmarks" autocomplete="off">
  </div>
  <div class="card" id="searchResults" role="listbox"></div>
</div>

<div class="chrome" id="actions">
  <button class="iconbtn wide" id="exportBtn" title="Save project (.pmap)" aria-label="Save project as portable file"><svg><use href="#i-save"/></svg><span>Save</span></button>
  <button class="iconbtn" id="openBtn" title="Open project / world" aria-label="Open project"><svg><use href="#i-open"/></svg></button>
  <button class="iconbtn" id="editBtn" title="Map editor" aria-label="Open map editor"><svg><use href="#i-edit"/></svg></button>
  <button class="iconbtn" id="advEditBtn" title="Advanced editor" aria-label="Open advanced editor"><svg><use href="#i-sliders"/></svg></button>
  <button class="iconbtn" id="debugBtn" title="Developer overlay" aria-label="Toggle developer overlay"><svg><use href="#i-bug"/></svg></button>
  <button class="iconbtn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen"><svg><use href="#i-max"/></svg></button>
</div>

<button id="compass" class="chrome" title="Reset north" aria-label="Compass — click to face north">
  <span class="n">N</span>
  <svg class="needle" viewBox="0 0 24 24" id="compassNeedle"><path d="M12 3l4 9-4 9-4-9z" fill="#d93025"/><path d="M12 3l4 9h-4z" fill="#f4b3ac"/></svg>
</button>

<div class="chrome card" id="locCard">
  <h2 id="locName">—</h2>
  <div class="zone" id="locZone">—</div>
  <dl>
    <dt>Position</dt><dd id="locPos">—</dd>
    <dt>Distance walked</dt><dd id="locDist">0 m</dd>
    <dt>Zone boundary</dt><dd id="locBound">—</dd>
    <dt>Connections</dt><dd id="locLinks">—</dd>
  </dl>
  <div class="row">
    <button class="chipbtn" id="acToggle" title="Detect and repair incomplete panorama regions" aria-pressed="true"><svg><use href="#i-magic"/></svg><span>AutoComplete</span></button>
    <button class="chipbtn" id="routeBtn" title="Route to nearest landmark"><svg><use href="#i-route"/></svg><span>Route</span></button>
  </div>
</div>

<div class="chrome" id="movePad" role="group" aria-label="Movement controls">
  <button class="mbtn" data-dir="forward" title="Move forward (W)" aria-label="Move forward"><svg><use href="#i-up"/></svg></button>
  <button class="mbtn" data-dir="left" title="Move left (A)" aria-label="Move left"><svg><use href="#i-left"/></svg></button>
  <button class="mbtn" data-dir="backward" title="Move backward (S)" aria-label="Move backward"><svg><use href="#i-down"/></svg></button>
  <button class="mbtn" data-dir="right" title="Move right (D)" aria-label="Move right"><svg><use href="#i-right"/></svg></button>
</div>

<div class="chrome card" id="mapWidget">
  <div class="mw-head">
    <span class="t" id="mapTitle">Map</span>
    <button class="iconbtn" id="mapZoomIn" title="Zoom in" aria-label="Zoom map in"><svg><use href="#i-zoomin"/></svg></button>
    <button class="iconbtn" id="mapZoomOut" title="Zoom out" aria-label="Zoom map out"><svg><use href="#i-zoomout"/></svg></button>
    <button class="iconbtn" id="mapFit" title="Fit world" aria-label="Fit world to map"><svg><use href="#i-fit"/></svg></button>
    <button class="iconbtn" id="mapExpand" title="Expand map" aria-label="Expand map"><svg><use href="#i-max"/></svg></button>
  </div>
  <div id="mapCanvasWrap"><canvas id="mapCanvas" aria-label="2D map"></canvas></div>
</div>

<div class="chrome" id="debugOverlay" hidden aria-label="Developer overlay"></div>
<div id="toasts" aria-live="polite"></div>

<!-- ============ panels/mount points (editors render into these) ============ -->
<div class="chrome card panel" id="editorPanel" hidden></div>
<div class="chrome card panel" id="advPanel" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
